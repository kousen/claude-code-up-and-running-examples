<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;800&display=swap">
  <style>
    body { margin: 0; font-family: Manrope, "Avenir Next", "Segoe UI", sans-serif; }
    a { color: #f4b942; } a:hover { color: #ffd479; }
  </style>
</helmet>
<div style="box-sizing: border-box; width: 390px; min-height: 760px; background: #0f1a24; color: #e8eef2; padding: 24px 20px; display: flex; flex-direction: column; gap: 24px;">
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <a href="#" style="color: #f4b942; font-weight: 500; font-size: 15px; text-decoration: none; display: flex; align-items: center; gap: 6px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      <span>Change city</span>
    </a>
    <div role="group" aria-label="Temperature unit" style="display: flex; border: 1px solid #2a3b48; border-radius: 999px; overflow: hidden;">
      <button style="min-width: 44px; height: 44px; border: 0; background: #f4b942; color: #0f1a24; font: inherit; font-weight: 800; font-size: 15px; cursor: pointer;" aria-pressed="true">°C</button>
      <button style="min-width: 44px; height: 44px; border: 0; background: transparent; color: #e8eef2; font: inherit; font-weight: 500; font-size: 15px; cursor: pointer;" aria-pressed="false">°F</button>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 4px;">
    <h1 style="margin: 0; font-size: 34px; font-weight: 800; line-height: 1.1;">Boston</h1>
    <p style="margin: 0; color: #9fb3c0; font-size: 15px;">Wednesday, September 16</p>
  </div>
  <div style="display: flex; align-items: center; gap: 20px;">
    <svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="#f4b942" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Clear sky"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"></path></svg>
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <p style="margin: 0; font-size: 72px; font-weight: 800; line-height: 1;">26°</p>
      <p style="margin: 0; font-size: 18px; font-weight: 500;">Clear</p>
    </div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
    <div style="background: #172634; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px;">
      <span style="color: #9fb3c0; font-size: 13px;">High / Low</span>
      <span style="font-size: 20px; font-weight: 800;">26° / 12°</span>
    </div>
    <div style="background: #172634; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px;">
      <span style="color: #9fb3c0; font-size: 13px;">Wind</span>
      <span style="font-size: 20px; font-weight: 800;">0.9 m/s</span>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px;">
    <h2 style="margin: 0; font-size: 15px; font-weight: 500; color: #9fb3c0; letter-spacing: 0.04em; text-transform: uppercase;">Five-day forecast</h2>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 16px; background: #172634; border-radius: 12px; min-height: 52px;">
        <span style="font-size: 15px; color: #9fb3c0;">Wed</span>
        <span style="display: flex; align-items: center; gap: 10px;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e8eef2" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Clouds"><path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.2 9.1 4.5 4.5 0 0 0 7 18z"></path></svg><span style="font-size: 16px;">Clouds</span></span>
        <span style="font-size: 18px; font-weight: 800;">25°</span>
      </div>
      <div style="display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 16px; background: #172634; border-radius: 12px; min-height: 52px;">
        <span style="font-size: 15px; color: #9fb3c0;">Thu</span>
        <span style="display: flex; align-items: center; gap: 10px;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e8eef2" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Clouds"><path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.2 9.1 4.5 4.5 0 0 0 7 18z"></path></svg><span style="font-size: 16px;">Clouds</span></span>
        <span style="font-size: 18px; font-weight: 800;">26°</span>
      </div>
      <div style="display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 16px; background: #172634; border-radius: 12px; min-height: 52px;">
        <span style="font-size: 15px; color: #9fb3c0;">Fri</span>
        <span style="display: flex; align-items: center; gap: 10px;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e8eef2" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Rain"><path d="M7 15h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.2 6.1 4.5 4.5 0 0 0 7 15zM8 18l-1 3M12 18l-1 3M16 18l-1 3"></path></svg><span style="font-size: 16px;">Rain</span></span>
        <span style="font-size: 18px; font-weight: 800;">22°</span>
      </div>
      <div style="display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 16px; background: #172634; border-radius: 12px; min-height: 52px;">
        <span style="font-size: 15px; color: #9fb3c0;">Sat</span>
        <span style="display: flex; align-items: center; gap: 10px;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f4b942" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Clear sky"><circle cx="12" cy="12" r="4"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"></path></svg><span style="font-size: 16px;">Clear sky</span></span>
        <span style="font-size: 18px; font-weight: 800;">24°</span>
      </div>
      <div style="display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 16px; background: #172634; border-radius: 12px; min-height: 52px;">
        <span style="font-size: 15px; color: #9fb3c0;">Sun</span>
        <span style="display: flex; align-items: center; gap: 10px;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e8eef2" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Clouds"><path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.2 9.1 4.5 4.5 0 0 0 7 18z"></path></svg><span style="font-size: 16px;">Clouds</span></span>
        <span style="font-size: 18px; font-weight: 800;">23°</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
